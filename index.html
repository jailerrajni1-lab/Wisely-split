<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#167d5a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Splitwise"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>Splitwise — Shared Expenses</title>
<style>
:root{--ink:#172b24;--muted:#6b7c73;--green:#147a55;--on-green:#fff;--green2:#e6f5ed;--bg:#f4f7f5;--card:#fff;--line:#e3ebe6;--red:#bb4545;--red2:#fdeeee;--track:#eaf0ec;--soft:#f6faf7;--amber:#fff5dc;--amber-ink:#70571a;--blue:#e8f1ff;--blue-ink:#1c4a8a;--shadow:0 8px 28px rgba(26,58,42,.06)}
:root[data-theme=dark]{--ink:#e9f1ed;--muted:#93a59c;--green:#2fb883;--on-green:#06231a;--green2:#173528;--bg:#0e1512;--card:#16201c;--line:#26332d;--red:#ef7b7b;--red2:#3a1f1f;--track:#243029;--soft:#1a2621;--amber:#3b3217;--amber-ink:#e8d28a;--blue:#17283f;--blue-ink:#a8c8f5;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;transition:.15s;touch-action:manipulation;min-height:38px}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.primary{background:var(--green);color:var(--on-green)}
.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.danger{color:var(--red);background:var(--red2)}
.ghost{background:transparent;color:var(--muted)}
.small{font-size:12px;padding:7px 10px;min-height:32px}
input,select,textarea{font-size:16px!important}
.hidden{display:none!important}
.app{max-width:1360px;margin:auto;padding:max(22px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) 100px max(28px,env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px;letter-spacing:-.6px;cursor:pointer}
.logo{width:36px;height:36px;background:var(--green);color:var(--on-green);border-radius:12px;display:grid;place-items:center;font-size:20px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:12px;color:var(--muted);cursor:pointer}
.avatar{width:35px;height:35px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.user-chip .avatar{width:26px;height:26px;font-size:11px;background:var(--green);color:var(--on-green)}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px}
.sidebar,.panel,.hero,.stat,.gcard{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.sidebar{padding:14px;height:fit-content;position:sticky;top:18px}
.nav{display:grid;gap:4px;margin-bottom:14px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:12px;color:var(--muted)}
.nav-item span{font-size:18px;width:22px;text-align:center}
.nav-item.active{background:var(--green2);color:var(--green)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 8px}
.side-head h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0}
.split-list{display:grid;gap:4px}
.split-item{padding:9px 10px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer;border:1px solid transparent}
.split-item:hover{background:var(--soft)}
.split-item.active{background:var(--green2);border-color:var(--line)}
.split-icon{width:32px;height:32px;border-radius:10px;background:var(--track);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.split-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.split-meta{font-size:12px;color:var(--muted)}
.main{min-width:0}
.eyebrow{color:var(--green);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:2px 0 20px;flex-wrap:wrap}
.page-head h1{font-size:clamp(25px,3vw,32px);line-height:1.1;letter-spacing:-.9px;margin:6px 0 4px}
.page-head p{color:var(--muted);margin:0;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{padding:22px 24px;margin-bottom:17px;background:linear-gradient(125deg,var(--card) 0%,var(--green2) 160%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title-line{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.title-line h2{margin:0;font-size:23px;letter-spacing:-.6px}
.subtitle{color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}
.stat{padding:16px;box-shadow:none;background:var(--card);border-radius:15px}
.stat-label{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}
.stat-value{font-size:25px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.stat-note{font-size:11px;color:var(--muted);margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}
.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:17px;align-items:start}
.stack{display:grid;gap:17px;min-width:0}
.panel{padding:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:15px}
.panel h3{font-size:15px;margin:0;letter-spacing:-.15px}
.panel-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:24px 2px 12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{padding:17px;cursor:pointer;transition:.15s;display:block;width:100%;text-align:left;font-weight:400}
.gcard:hover{border-color:var(--green);transform:translateY(-2px)}
.gcard-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.gcard .split-icon{width:42px;height:42px;font-size:19px;background:var(--green2)}
.gcard h4{margin:0;font-size:16px;letter-spacing:-.3px}
.gcard small{color:var(--muted)}
.gcard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:750;padding:5px 10px;border-radius:99px;background:var(--track);color:var(--muted)}
.chip.pos{background:var(--green2);color:var(--green)}.chip.neg{background:var(--red2);color:var(--red)}
.expense-list,.balance-list{display:grid;gap:10px}
.expense{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.expense-main{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
.expense-main:hover{background:var(--soft)}
.expense-icon{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:var(--green2);display:grid;place-items:center;font-size:20px}
.expense-body{min-width:0;flex:1}
.expense-title{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expense-detail{font-size:12px;color:var(--muted);margin-top:3px}
.expense-amount{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.expense-more{padding:4px 14px 14px 66px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);background:var(--soft)}
.expense-more div.line{display:flex;justify-content:space-between;padding:4px 0}
.expense-more .row{margin-top:8px}
.balance-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:12px;border-radius:13px;flex-wrap:wrap}
.balance-person{flex:1;min-width:120px}
.balance-person strong{display:block;font-size:13px}
.balance-person span{display:block;color:var(--muted);font-size:12px}
.settle-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.amount-negative{color:var(--red);font-weight:800;white-space:nowrap}
.search-tools{display:flex;gap:9px;margin:-2px 0 15px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:160px}
.search-wrap input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px 11px 37px;background:var(--soft);outline:none}
.search-wrap:before{content:'⌕';position:absolute;left:13px;top:5px;font-size:23px;color:var(--muted)}
.search-tools select{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 12px;min-width:130px}
.activity-list{display:grid}
.activity-item{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.activity-item:last-child{border-bottom:0}
.activity-dot{width:34px;height:34px;border-radius:11px;background:var(--green2);display:grid;place-items:center;flex-shrink:0}
.activity-copy{min-width:0;flex:1;font-size:13px}
.activity-copy strong{display:block}
.activity-copy span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.activity-value{font-weight:800;font-size:13px;white-space:nowrap}
.empty{padding:30px 15px;text-align:center;color:var(--muted)}
.empty .emoji{font-size:30px;margin-bottom:8px}
.empty strong{display:block;color:var(--ink);margin-bottom:5px}
.empty button{margin-top:12px}
.back{margin-bottom:12px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:17px}.charts .wide{grid-column:1/-1}
.bar-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.bar-track{background:var(--track);border-radius:99px;height:12px;overflow:hidden}
.bar{height:100%;border-radius:99px;transition:width .5s}
.bar-val{font-weight:800;font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex-shrink:0}
.legend{display:grid;gap:7px;font-size:13px;min-width:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tchart{width:100%;height:auto;display:block}
/* Settings */
.set-group{margin-bottom:17px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-row:first-of-type{padding-top:0}
.set-label strong{display:block;font-size:14px}
.set-label span{display:block;font-size:12px;color:var(--muted);margin-top:2px;max-width:420px}
.seg{display:inline-flex;background:var(--track);border-radius:11px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--muted);padding:7px 13px;min-height:32px;border-radius:9px;font-size:13px}
.seg button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
.set-row select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card)}
.switch{position:relative;width:46px;height:27px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--track);border-radius:99px;transition:.2s}
.switch i:after{content:'';position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0003}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:after{transform:translateX(19px)}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.profile .avatar{width:54px;height:54px;font-size:20px;background:var(--green);color:var(--on-green)}
.profile strong{font-size:17px;display:block}.profile span{color:var(--muted);font-size:13px}
.landing{max-width:520px;margin:6vh auto;text-align:center;padding:32px 24px}
.landing .logo{width:60px;height:60px;font-size:30px;margin:0 auto 18px;border-radius:18px}
.landing h1{margin:0 0 8px;letter-spacing:-1px}.landing p{color:var(--muted);margin:0 0 22px}
.features{display:grid;gap:8px;text-align:left;margin:0 0 22px;font-size:14px}
.features div{padding:10px 12px;background:var(--soft);border-radius:12px}
.notice{background:var(--amber);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--amber-ink);font-size:12px;margin-bottom:14px}
.sidebar .notice{background:var(--soft);color:var(--muted);margin:10px 0 0}
.sync{background:var(--blue);border:1px solid var(--line);color:var(--blue-ink);border-radius:11px;padding:10px 12px;font-size:12px;margin-bottom:14px}
.footnote{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
/* modal + toast */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,15,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal-backdrop.open{display:flex}
.modal{background:var(--card);width:min(500px,100%);border-radius:20px;padding:24px;box-shadow:0 24px 80px #0004;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 5px;font-size:22px}.modal p{margin:0 0 18px;color:var(--muted);font-size:13px}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--card)}
.field input:focus,.field select:focus{border-color:var(--green)}
.check{display:flex!important;align-items:center;gap:8px;font-weight:500!important;padding:4px 0}.check input{width:auto!important}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));z-index:30;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px #0004;animation:in .2s}
.toast.err{background:var(--red);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mobile-bottom{display:none}
@media(max-width:1050px){.layout{grid-template-columns:210px minmax(0,1fr);gap:16px}.columns{grid-template-columns:1fr}}
@media(max-width:850px){
 .app{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 110px max(14px,env(safe-area-inset-left))}
 .layout{grid-template-columns:1fr}.sidebar{display:none}
 .charts{grid-template-columns:1fr}.charts .wide{grid-column:auto}
 .topbar{margin-bottom:16px}.brand{font-size:19px}
 #addTop{display:none}
 .mobile-bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
 .mobile-bottom button{min-height:50px;background:transparent;color:var(--muted);font-size:11px;padding:5px 3px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
 .mobile-bottom button span{font-size:19px;line-height:1}
 .mobile-bottom button.active{color:var(--green);background:var(--green2)}
 .mobile-bottom button.plus span{background:var(--green);color:var(--on-green);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin-top:-18px;box-shadow:0 6px 16px #147a5555}
 #toasts{bottom:90px}
 .modal-backdrop{align-items:flex-end;padding:0}.modal{border-radius:20px 20px 0 0;width:100%;padding-bottom:max(24px,env(safe-area-inset-bottom))}
}
@media(max-width:520px){
 .hero{padding:17px}.stats{gap:7px}.stat{padding:10px 9px;border-radius:12px}
 .stat-label{font-size:10px;line-height:1.3;min-height:26px}.stat-value{font-size:16px;letter-spacing:-.4px;overflow-wrap:anywhere}.stat-note{display:none}
 .panel{padding:15px}.expense-main{gap:9px;padding:10px}.expense-icon{width:36px;height:36px}.expense-more{padding-left:14px}
 .search-tools{display:grid;grid-template-columns:1fr 130px}.search-wrap{min-width:0}.search-tools select{min-width:0;width:100%}
 .bar-row{grid-template-columns:75px 1fr auto;gap:7px;font-size:11px}.donut{width:125px;height:125px}
 .user-chip #userStatus{display:none}.user-chip{padding-right:4px}
 .hero-buttons{width:100%}.hero-buttons button{flex:1}
}
</style>
</head>
<body>
<div class="app">
  <div id="configWarning" class="notice hidden"></div><div id="syncBanner" class="sync hidden"></div>
  <header class="topbar">
    <div class="brand" data-act="go" data-to="home"><div class="logo">↗</div><span>split<span style="color:var(--green)">wise</span></span></div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="view"></main>
  </div>
</div>
<nav class="mobile-bottom" id="bottomNav" aria-label="Main navigation"></nav>
<div id="toasts" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2><p id="modalDescription"></p>
    <form id="modalForm"><div id="modalContent"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" class="primary" id="saveModal">Save</button></div></form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SETUP: Supabase Project URL and Publishable key. Never place a service-role/secret key in browser code. */
const SUPABASE_URL = "https://iwyfkswvhqqsygxafsxt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4jBN8lZ8FvQWNJWZiFilpA_fOyDh0pO";
const configured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");
const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;

(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APP_VERSION = '2.0';

/* ---------- preferences & theme ---------- */
const PK='sw_prefs';
let prefs={theme:'system',landing:'home',paise:true};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PK)||'{}'))}catch{}
const savePrefs=()=>{try{localStorage.setItem(PK,JSON.stringify(prefs))}catch{}};
function applyTheme(){
 const dark=prefs.theme==='dark'||(prefs.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0e1512':'#167d5a';
}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
const money=n=>{const d=prefs.paise?2:0;return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.abs(Number(n)||0))};
const short=n=>'₹'+new Intl.NumberFormat('en-IN',{notation:'compact',maximumFractionDigits:1}).format(Math.abs(n));
const fdate=s=>s?new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';

/* ---------- state ---------- */
let user=null, splits=[], D={};          // D[splitId] = {s, members, expenses, shares, settlements}
const ui={q:'',flt:'all',open:null,loading:false};
const isNet=e=>!navigator.onLine||/fetch|network|load failed/i.test(e?.message||'');
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>t.remove(),err?4500:2600)}
function fail(e){console.error(e);toast(e?.message||String(e),true)}
const defName=()=>user?.user_metadata?.display_name||user?.email?.split('@')[0]||'';

/* ---------- routing (hash based) ---------- */
function cur(){
 const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
 if(a==='group'&&b&&D[b])return{v:'group',id:b};
 if(a==='groups'||a==='group')return{v:'groups'};
 if(a==='settings')return{v:'settings'};
 if(a==='home')return{v:'home'};

/* ---------- money logic ---------- */
const nameOf=(d,id)=>d.members.find(m=>m.user_id===id)?.display_name||'Member';
function balances(d){
 const b={};d.members.forEach(m=>b[m.user_id]=0);
 d.expenses.forEach(e=>{const ss=d.shares.filter(x=>x.expense_id===e.id);if(!ss.length)return;b[e.paid_by]=(b[e.paid_by]||0)+Number(e.amount);ss.forEach(x=>b[x.user_id]=(b[x.user_id]||0)-Number(x.share_amount))});
 d.settlements.filter(t=>t.status==='settled').forEach(t=>{b[t.from_user]=(b[t.from_user]||0)+Number(t.amount);b[t.to_user]=(b[t.to_user]||0)-Number(t.amount)});
 return b;
}
function dues(b){
 const cr=Object.entries(b).filter(([,v])=>v>.005).map(([id,amount])=>({id,amount})).sort((a,b)=>b.amount-a.amount);
 const dbt=Object.entries(b).filter(([,v])=>v<-.005).map(([id,amount])=>({id,amount:-amount})).sort((a,b)=>b.amount-a.amount);
 const out=[];let i=0,j=0;
 while(i<dbt.length&&j<cr.length){const amount=Math.min(dbt[i].amount,cr[j].amount);if(amount>.005)out.push({from:dbt[i].id,to:cr[j].id,amount});dbt[i].amount-=amount;cr[j].amount-=amount;if(dbt[i].amount<.005)i++;if(cr[j].amount<.005)j++}
 return out;
}
function mine(d){const ds=dues(balances(d)),owed=ds.filter(x=>x.to===user?.id).reduce((a,x)=>a+x.amount,0),owe=ds.filter(x=>x.from===user?.id).reduce((a,x)=>a+x.amount,0);return{owed,owe,net:owed-owe,ds}}
const total=d=>d.expenses.reduce((a,e)=>a+Number(e.amount),0);
function activityOf(d){
 return [...d.expenses.map(e=>({kind:'expense',gid:d.s.id,g:d.s.title,at:e.created_at,title:e.title,detail:`${nameOf(d,e.paid_by)} added an expense`,amount:Number(e.amount)})),
  ...d.settlements.map(t=>({kind:'settlement',gid:d.s.id,g:d.s.title,at:t.settled_at||t.created_at,title:'Settlement',detail:`${nameOf(d,t.from_user)} paid ${nameOf(d,t.to_user)}${t.status==='settled'?' · Settled':''}`,amount:Number(t.amount)}))].filter(x=>x.at);
}
const statusChip=st=>st.owed>.005?`<span class="chip pos">You are owed ${money(st.owed)}</span>`:st.owe>.005?`<span class="chip neg">You owe ${money(st.owe)}</span>`:'<span class="chip">Settled up</span>';

/* ---------- data loading ---------- */
async function fetchAll(){
 const {data,error}=await db.from('split_members').select('split_id,splits(id,title,invite_code,created_by)').eq('user_id',user.id);if(error)throw error;
 const list=(data||[]).map(r=>r.splits).filter(Boolean),ids=list.map(s=>s.id),out={};
 list.forEach(s=>out[s.id]={s,members:[],expenses:[],shares:[],settlements:[]});
 if(ids.length){
  const [m,e,t]=await Promise.all([
   db.from('split_members').select('split_id,user_id,display_name').in('split_id',ids),
   db.from('expenses').select('id,split_id,title,amount,paid_by,created_at').in('split_id',ids).order('created_at',{ascending:false}),
   db.from('settlements').select('id,split_id,from_user,to_user,amount,status,created_at,settled_at').in('split_id',ids)]);
  if(m.error)throw m.error;if(e.error)throw e.error;if(t.error)throw t.error;
  m.data.forEach(x=>out[x.split_id]?.members.push(x));e.data.forEach(x=>out[x.split_id]?.expenses.push(x));t.data.forEach(x=>out[x.split_id]?.settlements.push(x));
  const eids=e.data.map(x=>x.id),byExp={};e.data.forEach(x=>byExp[x.id]=x.split_id);
  for(let i=0;i<eids.length;i+=100){const r=await db.from('expense_shares').select('expense_id,user_id,share_amount').in('expense_id',eids.slice(i,i+100));if(r.error)throw r.error;r.data.forEach(x=>out[byExp[x.expense_id]]?.shares.push(x))}
 }
 return {list,out};
}
async function loadAll(){
 if(!user){splits=[];D={};render();return}
 try{const {list,out}=await fetchAll();splits=list;D=out;try{localStorage.setItem('sw_all',JSON.stringify({splits,D}))}catch{}}
 catch(e){let c=null;try{c=isNet(e)&&JSON.parse(localStorage.getItem('sw_all')||'null')}catch{}if(!c)throw e;splits=c.splits;D=c.D;toast('Offline — showing saved data')}
 render();
}

const COLORS=['#167d5a','#2f80ed','#f2994a','#9b51e0','#eb5757','#00a3a3','#c2a000','#6c757d','#d6336c','#5c7cfa','#74b816','#e8590c','#0b7285','#862e9c','#495057'];

function drawCharts(d){
 if(!$('chartPaid')||!d)return;
 const col=id=>COLORS[Math.max(0,d.members.findIndex(m=>m.user_id===id))%COLORS.length];
 const paid={};d.expenses.forEach(e=>paid[e.paid_by]=(paid[e.paid_by]||0)+Number(e.amount));
 const items=Object.entries(paid).map(([id,v])=>({label:nameOf(d,id),value:v,color:col(id)})).sort((a,b)=>b.value-a.value),t=items.reduce((a,i)=>a+i.value,0);
 let off=0;
 $('chartPaid').innerHTML=t?`<div class="donut-wrap"><svg class="donut" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.915" fill="none" style="stroke:var(--track)" stroke-width="6"/>${items.map(i=>{const p=i.value/t*100,c=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${i.color}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p;return c}).join('')}<text x="21" y="22.5" text-anchor="middle" font-size="4.6" font-weight="800" style="fill:var(--ink)">${short(t)}</text></svg><div class="legend">${items.map(i=>`<div><i style="background:${i.color}"></i>${esc(i.label)} <b>${money(i.value)}</b></div>`).join('')}</div></div>`:noData;
 const b=balances(d),bl=Object.entries(b).map(([id,v])=>({label:nameOf(d,id),value:v})).sort((a,c)=>c.value-a.value),mx=Math.max(...bl.map(i=>Math.abs(i.value)),1);
 $('chartBal').innerHTML=d.expenses.length?bl.map(i=>`<div class="bar-row"><div class="bar-label">${esc(i.label)}</div><div class="bar-track"><div class="bar" style="width:${Math.max(2,Math.abs(i.value)/mx*100)}%;background:${i.value>=0?'var(--green)':'var(--red)'}"></div></div><div class="bar-val" style="color:${i.value>=0?'var(--green)':'var(--red)'}">${i.value>=0?'+':'−'}${money(i.value)}</div></div>`).join(''):noData;
 const months=[],tot={};
 for(let k=5;k>=0;k--){const dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()-k);const key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');months.push({d:dt,key});tot[key]=0}
 d.expenses.forEach(e=>{const dt=new Date(e.created_at),k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');if(k in tot)tot[k]+=Number(e.amount)});
 const m=Math.max(...Object.values(tot),1);
 $('chartTime').innerHTML=d.expenses.length?`<svg class="tchart" viewBox="0 0 360 150">${months.map((o,i)=>{const v=tot[o.key],h=v/m*85,x=10+i*58;return `<rect x="${x}" y="${108-h}" width="34" height="${Math.max(h,v?2:0)}" rx="6" style="fill:${v?'var(--green)':'var(--track)'}"/>${v?`<text x="${x+17}" y="${101-h}" text-anchor="middle" font-size="8" style="fill:var(--muted)">${short(v)}</text>`:''}<text x="${x+17}" y="130" text-anchor="middle" font-size="9" style="fill:var(--muted)">${o.d.toLocaleDateString('en-IN',{month:'short'})}</text>`}).join('')}</svg>`:noData;
}

/* ---------- offline queue ---------- */
const QK='sw_pending',getQ=()=>{try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch{return[]}},setQ=q=>{try{localStorage.setItem(QK,JSON.stringify(q))}catch{}};
function banner(){const n=getQ().length;$('syncBanner').classList.toggle('hidden',!n);$('syncBanner').textContent=n?`${n} expense${n>1?'s':''} saved on this device. Will upload automatically when you're back online.`:''}
async function saveExpense(x){
 const {data:e,error}=await db.from('expenses').insert({split_id:x.split_id,title:x.title,amount:x.amount,paid_by:x.paid_by}).select('id').single();if(error)throw error;
 const {error:se}=await db.from('expense_shares').insert(x.shares.map(r=>({expense_id:e.id,...r})));
 if(se){await db.from('expenses').delete().eq('id',e.id);throw se}
}
async function flushQ(){
 if(!user||!navigator.onLine)return;const q=getQ();if(!q.length)return;const left=[];
 for(const x of q){try{await saveExpense(x)}catch(e){if(isNet(e))left.push(x);else fail(new Error('Could not upload "'+x.title+'": '+e.message))}}
 setQ(left);banner();if(left.length!==q.length){toast('Offline expenses uploaded');await loadAll()}
}

/* ---------- forms ---------- */
function openForm(title,desc,fields,submit){return new Promise(res=>{
 $('modalTitle').textContent=title;$('modalDescription').textContent=desc;$('saveModal').textContent=submit;
 const opt=(f,o)=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`;
 $('modalContent').innerHTML=fields.map(f=>`<div class="field"><label>${f.label}</label>`+(f.type==='checks'?f.options.map(o=>`<label class="check"><input type="checkbox" name="${f.name}" value="${esc(o[0])}" checked> ${esc(o[1])}</label>`).join(''):f.type==='select'?`<select name="${f.name}">${f.options.map(o=>opt(f,o)).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" ${f.step?`step="${f.step}"`:''} ${f.type==='password'?'minlength="6"':''} required>`)+'</div>').join('');
 const bd=$('modalBackdrop'),form=$('modalForm');bd.classList.add('open');
 const close=v=>{bd.classList.remove('open');form.onsubmit=null;$('cancelModal').onclick=null;res(v)};
 form.onsubmit=ev=>{ev.preventDefault();const fd=new FormData(form),o={};fields.forEach(f=>o[f.name]=f.type==='checks'?fd.getAll(f.name):fd.get(f.name));close(o)};
 $('cancelModal').onclick=()=>close(null);setTimeout(()=>form.querySelector('input,select')?.focus(),50);
})}
const needDb=()=>{if(!configured){toast('Add your Supabase URL and publishable key first.',true);return false}return true};
async function signIn(){
 if(!needDb())return;
 const v=await openForm('Sign in','Use your email and password.',[{name:'email',label:'Email',type:'email'},{name:'password',label:'Password',type:'password'}],'Sign in');if(!v)return;
 const {error}=await db.auth.signInWithPassword({email:v.email.trim(),password:v.password});if(error)throw error;
}
async function createAccount(){
 if(!needDb())return;
 const v=await openForm('Create account','Your display name is shown to group members.',[{name:'name',label:'Display name'},{name:'email',label:'Email',type:'email'},{name:'password',label:'Password (min 6 characters)',type:'password'}],'Create account');if(!v)return;
 const {data,error}=await db.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{display_name:v.name.trim()}}});if(error)throw error;
 if(!data.session)toast('Account created. Check your email to confirm it, then sign in.');
}
async function createSplit(){
 const v=await openForm('Create a group','Name the group, then invite others with the invitation code.',[{name:'title',label:'Group name (e.g. Goa trip)'},{name:'name',label:'Your name in this group',value:defName()}],'Create group');if(!v)return;
 const {data,error}=await db.rpc('create_split',{p_title:v.title.trim(),p_display_name:v.name.trim()});if(error)throw error;
 await loadAll();toast('Group created');go('group/'+data.id);
}
async function joinFlow(code){
 const v=await openForm('Join a group','Enter the invitation code you received.',[{name:'code',label:'Invitation code',value:code||''},{name:'name',label:'Your name in this group',value:defName()}],'Join group');if(!v)return;
 const {data,error}=await db.rpc('join_split',{p_invite_code:v.code.trim(),p_display_name:v.name.trim()});if(error)throw error;
 await loadAll();toast('Joined group');if(data?.split_id)go('group/'+data.split_id);
}
async function addExpense(gid){
 if(!splits.length){toast('Create a group first');go('groups');return}
 if(!gid)gid=splits.length===1?splits[0].id:null;
 if(!gid){const p=await openForm('Add expense','Which group is this expense for?',[{name:'g',label:'Group',type:'select',options:splits.map(s=>[s.id,s.title])}],'Continue');if(!p)return;gid=p.g}
 const d=D[gid],opts=d.members.map(m=>[m.user_id,m.display_name]);
 const v=await openForm('Add expense · '+d.s.title,'Split equally between the people you select.',[{name:'title',label:'Description'},{name:'amount',label:'Amount (₹)',type:'number',step:'0.01'},{name:'payer',label:'Paid by',type:'select',options:opts,value:user.id},{name:'who',label:'Split between',type:'checks',options:opts}],'Add expense');if(!v)return;
 const amount=Number(v.amount);if(!(amount>0))throw new Error('Enter a valid positive amount.');
 const unique=[...new Set(v.who)];if(!unique.length)throw new Error('Choose at least one person to split with.');
 const rounded=Math.round(amount*100)/100,each=Math.floor(rounded/unique.length*100)/100,remaining=Math.round(rounded*100)-Math.round(each*100)*(unique.length-1);
 const item={split_id:gid,title:v.title.trim(),amount:rounded,paid_by:v.payer,shares:unique.map((user_id,i)=>({user_id,share_amount:i===unique.length-1?remaining/100:each}))};
 try{await saveExpense(item)}catch(e){if(!isNet(e))throw e;setQ([...getQ(),item]);banner();toast('You are offline — expense saved on this device');return}
 await loadAll();toast('Expense added');
}
async function settle(gid,from,to,amount){
 const d=D[gid];
 if(!confirm(`Mark ${money(amount)} from ${nameOf(d,from)} to ${nameOf(d,to)} as settled?`))return;
 const {error}=await db.from('settlements').insert({split_id:gid,from_user:from,to_user:to,amount:Math.round(amount*100)/100,status:'settled',settled_at:new Date().toISOString()});if(error)throw error;
 await loadAll();toast('Settlement recorded');
}
function inviteText(s){return `Join "${s.title}" on Splitwise.\nInvitation code: ${s.invite_code}\n${location.origin}${location.pathname}#join=${s.invite_code}`}
async function copyText(t,ok){try{await navigator.clipboard.writeText(t);toast(ok)}catch{prompt('Copy this:',t)}}
async function managePeople(gid){
 const d=D[gid];
 const v=await openForm('People · '+d.s.title,`${d.members.map(m=>m.display_name).join(', ')} (${d.members.length}/15). Invitation code: ${d.s.invite_code}`,[],'Copy invitation');
 if(v)await copyText(inviteText(d.s),'Invitation copied');
}
async function shareSplit(gid){
 const text=inviteText(D[gid].s);
 try{if(navigator.share)await navigator.share({title:D[gid].s.title,text});else await copyText(text,'Invitation copied to clipboard')}catch(e){if(e.name!=='AbortError')prompt('Copy this invitation:',text)}
}
function exportCSV(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['Group','Date','Description','Paid by','Amount (INR)','Split between'].map(q).join(',')];
 splits.forEach(s=>{const d=D[s.id];d.expenses.forEach(e=>rows.push([s.title,new Date(e.created_at).toISOString().slice(0,10),e.title,nameOf(d,e.paid_by),Number(e.amount).toFixed(2),d.shares.filter(x=>x.expense_id===e.id).map(x=>nameOf(d,x.user_id)).join('; ')].map(q).join(',')))});
 if(rows.length===1)return toast('No expenses to export yet');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='splitwise-expenses.csv';document.body.appendChild(a);a.click();a.remove();toast('Export downloaded');
}

/* ---------- install ---------- */
let dip=null;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
async function install(){
 if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return toast('App is already installed');
 if(dip){dip.prompt();await dip.userChoice;dip=null}
 else if(isIOS)alert('On iPhone or iPad: tap the Share button in Safari, then choose "Add to Home Screen".');
 else toast('Use your browser menu → "Install app" / "Add to Home screen"');
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id;
 run(a,t,id).catch(fail);
});
async function run(a,t,id){
 const c=cur();
 switch(a){
  case 'go':return go(t.dataset.to);
  case 'open-group':ui.q='';ui.flt='all';ui.open=null;return go('group/'+id);
  case 'add-expense':return addExpense(id||(c.v==='group'?c.id:null));
  case 'new-split':return createSplit();
  case 'join':return joinFlow();
  case 'signin':return signIn();
  case 'signup':return createAccount();
  case 'signout':{const {error}=await db.auth.signOut();if(error)throw error;go('home');return}
  case 'rename':{const d=D[id],v=await openForm('Rename group','',[{name:'title',label:'Group name',value:d.s.title}],'Save');if(!v)return;const {error}=await db.from('splits').update({title:v.title.trim()}).eq('id',id);if(error)throw error;await loadAll();return toast('Group renamed')}
  case 'people':return managePeople(id);
  case 'share':return shareSplit(id);
  case 'settle':return settle(id,t.dataset.from,t.dataset.to,Number(t.dataset.amount));
  case 'toggle-exp':ui.open=ui.open===id?null:id;return renderTx();
  case 'del-exp':{if(!confirm('Delete this expense? This cannot be undone.'))return;await db.from('expense_shares').delete().eq('expense_id',id);const {error}=await db.from('expenses').delete().eq('id',id);if(error)throw error;ui.open=null;await loadAll();return toast('Expense deleted')}
  case 'pref':prefs[t.dataset.k]=t.dataset.v;savePrefs();if(t.dataset.k==='theme')applyTheme();return render();
  case 'name':{const v=await openForm('Display name','This is how other members see you.',[{name:'name',label:'Display name',value:defName()}],'Save');if(!v)return;const nm=v.name.trim();const {data,error}=await db.auth.updateUser({data:{display_name:nm}});if(error)throw error;user=data.user||user;await db.from('split_members').update({display_name:nm}).eq('user_id',user.id);await loadAll();return toast('Name updated')}
  case 'password':{const v=await openForm('Change password','Choose a new password (min 6 characters).',[{name:'p',label:'New password',type:'password'}],'Update');if(!v)return;const {error}=await db.auth.updateUser({password:v.p});if(error)throw error;return toast('Password updated')}
  case 'export':return exportCSV();
  case 'clearcache':{Object.keys(localStorage).filter(k=>k==='sw_all'||k==='sw_splits'||k.startsWith('sw_c_')).forEach(k=>localStorage.removeItem(k));try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch{}return toast('Offline cache cleared')}
  case 'install':return install();
 }
}
document.addEventListener('input',e=>{
 if(e.target.id==='q'){ui.q=e.target.value;renderTx()}
});
document.addEventListener('change',e=>{
 if(e.target.id==='f'){ui.flt=e.target.value;renderTx()}
 if(e.target.dataset?.pref==='paise'){prefs.paise=e.target.checked;savePrefs();render()}
});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('online',()=>flushQ().catch(fail));banner();

/* ---------- boot ---------- */
if(!configured){$('configWarning').classList.remove('hidden');$('configWarning').textContent='Setup required: add your Supabase project URL and publishable key in index.html.';render();return}
let pendingJoin=new URLSearchParams(location.hash.slice(1)).get('join');
function maybeJoin(){if(pendingJoin&&user){const c=pendingJoin;pendingJoin=null;history.replaceState(null,'',location.pathname+'#/home');joinFlow(c).catch(fail)}}
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(()=>loadAll().then(flushQ).then(maybeJoin).catch(fail),0)});
db.auth.getSession().then(({data,error})=>{if(error)throw error;user=data.session?.user||null;return loadAll()}).then(maybeJoin).catch(fail);
if(pendingJoin)setTimeout(()=>{if(!user)toast('Sign in or create an account to join this group.')},900);
render();
})();
</script>
